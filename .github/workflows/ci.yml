name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI placeholder"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
